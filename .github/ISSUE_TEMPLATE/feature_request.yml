name: Feature proposal
description: Propose a focused improvement with a clear user benefit.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and documentation.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need or limitation without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior and success criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or competing approaches.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
