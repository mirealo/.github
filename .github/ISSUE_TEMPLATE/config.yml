blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/mirealo/.github/blob/main/SECURITY.md
    about: >-
      Read the security policy and report privately through the affected
      repository. Never disclose a vulnerability in a public issue.
  - name: Support and questions
    url: https://github.com/mirealo/.github/blob/main/SUPPORT.md
    about: >-
      Review the support policy. Issues are reserved for actionable bugs,
      features, documentation, and maintenance work.
  - name: Conduct concern
    url: https://github.com/mirealo/.github/blob/main/CODE_OF_CONDUCT.md
    about: >-
      Review the confidential reporting policy before sharing sensitive
      conduct information. Do not publish a conduct report in an issue.
