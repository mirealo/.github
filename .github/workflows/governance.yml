name: Governance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report tool versions
        run: |
          python3 --version
          yq --version

      - name: Run governance unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate governance repository
        run: python3 .github/scripts/validate_governance.py
