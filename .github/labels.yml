version: 1
labels:
  - name: bug
    color: d73a4a
    description: Pull request addressing a defect; issues use the native Bug type.
    category: work
  - name: documentation
    color: 0075ca
    description: Documentation subtype for Task issues and related pull requests.
    category: work
  - name: enhancement
    color: a2eeef
    description: Pull request implementing a feature; issues use the native Feature type.
    category: work
  - name: maintenance
    color: "5319e7"
    description: Maintenance subtype for Task issues and related pull requests.
    category: work
  - name: dependencies
    color: 0366d6
    description: Dependency maintenance for issues and pull requests.
    category: work
  - name: "status: needs-triage"
    color: d4c5f9
    description: Awaiting initial maintainer review and classification.
    category: status
  - name: "status: needs-info"
    color: fbca04
    description: Waiting for information required to continue triage or implementation.
    category: status
  - name: "status: accepted"
    color: 0e8a16
    description: Approved for implementation but not yet started.
    category: status
  - name: "status: in-progress"
    color: 1d76db
    description: Implementation or remediation is actively underway.
    category: status
  - name: "status: blocked"
    color: b60205
    description: Cannot proceed until a documented dependency or decision is resolved.
    category: status
  - name: good first issue
    color: 7057ff
    description: Well-scoped work suitable for a first contribution.
    category: contribution
  - name: help wanted
    color: "008672"
    description: Maintainers welcome a community contribution for this work.
    category: contribution
