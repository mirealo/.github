version: 1
labels:
  - name: bug
    color: d73a4a
    description: Reproducible defect in a supported version or exact commit.
    category: work
  - name: documentation
    color: 0075ca
    description: Incorrect, missing, unclear, or outdated documentation.
    category: work
  - name: enhancement
    color: a2eeef
    description: Proposed product or engineering improvement with a clear user benefit.
    category: work
  - name: maintenance
    color: "5319e7"
    description: Technical, automation, policy, or repository upkeep that is not a feature or defect.
    category: work
  - name: dependencies
    color: 0366d6
    description: Dependency-only updates, including controlled automated upgrades.
    category: work
  - name: "status: needs-triage"
    color: d4c5f9
    description: Awaiting initial maintainer review and classification.
    category: status
  - name: "status: needs-info"
    color: fbca04
    description: Waiting for information required to continue triage or implementation.
    category: status
  - name: "status: accepted"
    color: 0e8a16
    description: Approved for implementation but not yet started.
    category: status
  - name: "status: in-progress"
    color: 1d76db
    description: Implementation or remediation is actively underway.
    category: status
  - name: "status: blocked"
    color: b60205
    description: Cannot proceed until a documented dependency or decision is resolved.
    category: status
  - name: "priority: critical"
    color: b60205
    description: Immediate attention required because of severe operational or user impact.
    category: priority
  - name: "priority: high"
    color: d93f0b
    description: High-impact work that should precede normal-priority items.
    category: priority
  - name: "priority: medium"
    color: fbca04
    description: Normal planned priority after maintainer triage.
    category: priority
  - name: "priority: low"
    color: c5def5
    description: Useful work with limited impact or urgency.
    category: priority
  - name: good first issue
    color: 7057ff
    description: Well-scoped work suitable for a first contribution.
    category: contribution
  - name: help wanted
    color: "008672"
    description: Maintainers welcome a community contribution for this work.
    category: contribution
  - name: "resolution: duplicate"
    color: cfd3d7
    description: Closed because equivalent work is already tracked elsewhere.
    category: resolution
  - name: "resolution: not-actionable"
    color: cfd3d7
    description: Closed because the report is incomplete, unsupported, or outside scope.
    category: resolution
  - name: "resolution: not-planned"
    color: cfd3d7
    description: Closed because the requested work is not planned.
    category: resolution
